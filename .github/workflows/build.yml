name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:jvmTest

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/myinvoice.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/myinvoice.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. The APK uses a throwaway key and won't install over an existing copy."
          fi

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Check APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs androidApp/build/outputs/apk/debug/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-invoice-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
